	<h1> DASH-JS Showcase </h1>
	This showcase will only work using Google Chrome with MediaSource API enabled (use chrome://flags to enable the API). 
<p>
    <br>
        Bandwidth in kbps (0=infinite[estimated]): <input type="text" id="bps" value="0"> <input type="button" value="Set" onClick="javascript:setBandwidth()"></p>
	<p>
		<!-- 20261003：ISAC 接口开关。ON = 播放逻辑听 ISAC 的（检测到多普勒就进入 doppler_detected：强制最低码率、放大 buffer）；
		     OFF = 完全不考虑 ISAC（纯 ABR 基线）。关掉时检测照常显示、照常记录，每次开关都记一条带 server 时间的事件，
		     见 dash-js/isac.js 和 snapshots_FORMAT.md -->
		<input type="button" id="isacIfBtn" value="ISAC interface: ON" onClick="javascript:toggleISACInterface()" style="font-weight:bold; background:#bdf0c0; padding:4px 12px;">
		&nbsp; effective mode: <b><span id="isacModeLabel">normal</span></b>
		&nbsp; ISAC detection: <b><span id="isacDetectedLabel">normal</span></b>
		&nbsp; &nbsp;

		<input type="button" value="Simulate: back to normal" onClick="javascript:setISACMode('normal', 'manual'); updateISACLabels();">
	</p>

		<script>
 		document.getElementById("bps").value = maxBandwidth/1024;
		function setBandwidth()  //set the estimated maxBandwidth when trigger the event, 
		                         //only affect the bitrate selection, not limit the real bandwidth
            {
                
                mybps = parseInt(document.getElementById("bps").value)*1024;
                maxBandwidth = mybps;
                
            }
		
		 
		
		 video = document.querySelector('video');  // get the first element with the element name
		// video = document.getElementById('myVideo'); // get element by id the same performance
		// 20261016：网页地址后面加 ?mpd=tos 就改用 Tears of Steel 高码率阶梯（tos_ibmff_mixed_1080p-public-access.mpd，
		// 100 kbit/s – 16 Mbit/s 共 21 档）；不加参数就和以前完全一样（bunny）。?mpd=<名字> 读 <名字>_ibmff_mixed_1080p-public-access.mpd
		var mpdName = "bunny";
		try { var mpdQ = new URLSearchParams(window.location.search).get("mpd"); if (mpdQ && /^[A-Za-z0-9_-]+$/.test(mpdQ)) mpdName = mpdQ; } catch (e) {}
		var dashPlayer = new DASHPlayer(video, "http://" + window.location.hostname + ":8080/" + mpdName + "_ibmff_mixed_1080p-public-access.mpd");
		//var dashPlayer = new DASHPlayer(video, "http://192.168.1.103:8080/bunny_ibmff_mixed_1080p.mpd");
		// 这里新建了一个DASHPlayer的对象 dashPlayer, 其参数为当前video元素，以及指定的mpd文件
